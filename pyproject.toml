[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbshield-defense"
version = "0.2.0"
description = "Enterprise Database Guardrail & Wire Proxy Python SDK for Autonomous AI Agents (LangChain, CrewAI, LlamaIndex)"
readme = "README.md"
authors = [
    { name = "RitualDev Studio", email = "developer@ritualdev.in" },
    { name = "RitualDev Security", email = "security@ritualdev.in" }
]
license = { text = "MIT" }
keywords = [
    "ai-agents",
    "database-security",
    "sql-guardrail",
    "ast-validator",
    "pii-masking",
    "sandbox",
    "two-phase-commit",
    "langchain",
    "crewai",
    "llamaindex"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.1.0"
]
langchain = [
    "langchain-core>=0.1.0"
]
crewai = [
    "crewai>=0.1.0"
]
llamaindex = [
    "llama-index-core>=0.10.0"
]
sqlalchemy = [
    "sqlalchemy>=2.0.0"
]

[project.urls]
Homepage = "https://ritualdev.in/dbshield"
Documentation = "https://ritualdev.in/docs"
TrustCenter = "https://ritualdev.in/trust"
Repository = "https://github.com/RitualDev-Lab/dbshield-python"
Issues = "https://github.com/RitualDev-Lab/dbshield-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
